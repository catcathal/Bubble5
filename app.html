<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble5 | Business portal</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/portal.css">
  <style>
    .auth-wrap { min-height: calc(100vh - 62px); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px 60px; background: var(--mist); }
    .auth-card { width: 100%; max-width: 440px; background: #fff; border: 1.5px solid var(--line); border-radius: 22px; padding: 28px 24px; }
    .auth-card h1 { font-size: 1.7rem; margin-bottom: 6px; }
    .tabs { display: flex; gap: 6px; padding: 4px; background: var(--mist); border-radius: 999px; margin: 18px 0 22px; }
    .tabs button { flex: 1; min-height: 42px; border: none; border-radius: 999px; background: transparent; font: 600 .98rem var(--body); color: var(--ink-soft); cursor: pointer; }
    .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15,42,46,.18); }

    .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding-top: 28px; padding-bottom: 60px; }
    .side { position: sticky; top: 90px; align-self: start; }
    .side a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; margin-bottom: 4px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 600; }
    .side a:hover { background: var(--mist); }
    .side a[aria-current="page"] { background: var(--ink); color: #fff; }
    .tabbar { display: none; }
    .pillbadge { background: var(--sun); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: .8rem; font-weight: 700; }
    .live-grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; align-items: start; }
    .live-grid > * { min-width: 0; }
    @media (min-width: 900px) { .live-grid { grid-template-columns: 340px minmax(0,1fr); } }
    @media (max-width: 899px) { .live-grid.has-thread #liveList { display: none; } .live-grid:not(.has-thread) #liveThread { display: none; } }
    .lchat { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px; cursor: pointer; font: inherit; color: inherit; }
    .lchat[aria-current="true"] { background: var(--mist); }
    .lchat .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
    .lchat .snip { color: var(--ink-soft); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .here { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #2fbf71; margin-right: 6px; }
    .lthread { height: 36vh; min-height: 220px; overflow-y: auto; background: var(--mist); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .lform { display: flex; gap: 8px; align-items: flex-end; }
    .lform textarea { flex: 1; min-width: 0; min-height: 46px; max-height: 120px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; resize: none; }

    .two-col { display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; align-items: start; }
    @media (min-width: 900px) { .two-col { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
    .two-col > * { min-width: 0; }
    .form-group select { appearance: auto; }
    .testlog { height: 260px; overflow-y: auto; background: var(--mist); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .tm { max-width: 88%; padding: 8px 12px; border-radius: 14px; font-size: .95rem; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .tm.a { background: #fff; border: 1px solid var(--line); align-self: flex-start; }
    .tm.u { background: var(--lagoon); color: #fff; align-self: flex-end; }
    .tm.flag { border-color: var(--warn); }
    .tm.note { background: #fff7e0; border: 1px dashed #d9a400; max-width: 100%; align-self: stretch; font-size: .88rem; color: var(--ink-soft); }
    .testform { display: flex; gap: 8px; }
    .testform input { flex: 1; min-width: 0; min-height: 42px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px; font: inherit; }

    /* chatbot customisation */
    .cz-grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; align-items: start; }
    @media (min-width: 1000px) { .cz-grid { grid-template-columns: minmax(0,1.15fr) minmax(340px,.85fr); } .cz-side .pv-card { position: sticky; top: 78px; z-index: 1; } }
    .cz-grid > * { min-width: 0; }
    .cz-side .card + .card { margin-top: 16px; }
    .cz-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1.5px solid var(--line); }
    .cz-tabs button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font: 600 .95rem var(--body); cursor: pointer; }
    .cz-tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .cz-pane[hidden] { display: none; }
    .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .choice { position: relative; display: block; cursor: pointer; }
    .choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .choice > span { display: block; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
    .choice b { display: block; font-size: .98rem; }
    .choice small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: .82rem; line-height: 1.3; }
    .choice input:checked + span { border-color: var(--lagoon); box-shadow: 0 0 0 3px rgba(14,124,123,.18); background: var(--mist); }
    .choice input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }
    .seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
    .seg .choice > span { border: 0; border-radius: 0; padding: 9px 18px; background: transparent; }
    .seg .choice input:checked + span { background: var(--ink); color: #fff; box-shadow: none; }
    .seg .choice input:checked + span b { color: #fff; }
    .seg .choice b { font-weight: 600; }
    .check { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; font-weight: 600; }
    .check input { width: 20px; height: 20px; flex: none; }
    .check.locked { color: var(--ink-soft); }
    .lock-pill { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--sun); color: var(--ink); font-size: .75rem; font-weight: 800; text-decoration: none; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .sw-btn { min-width: 40px; height: 40px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 1.25rem; cursor: pointer; }
    .sw-btn.txt { font: 600 .85rem var(--body); }
    .sw-btn.dot { width: 34px; min-width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line); }
    .color-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .color-row input[type=color] { width: 64px; min-width: 64px; min-height: 48px; padding: 4px; }
    .color-row .swatches { margin-top: 0; }
    .ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .idea { padding: 6px 12px; border: 1.5px dashed var(--line); border-radius: 999px; background: #fff; color: var(--ink-soft); font: 500 .85rem var(--body); cursor: pointer; text-align: left; }
    .idea:hover { border-color: var(--lagoon); color: var(--ink); }
    .row-edit { display: flex; gap: 8px; margin-bottom: 8px; }
    .row-edit input { flex: 1; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; background: var(--paper); }
    .faq-edit { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); }
    .faq-edit input, .faq-edit textarea { width: 100%; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; background: #fff; resize: vertical; }
    .faq-edit button { justify-self: end; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .save-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; bottom: 0; margin: 20px -24px -24px; padding: 14px 24px; background: rgba(255,255,255,.96); border-top: 1.5px solid var(--line); border-radius: 0 0 18px 18px; }
    /* live preview */
    .pv { --bg: #fff; --fg: #1b1b24; --log: #f6f6fa; --bub: #fff; --line2: #e6e6ee; --mu: #8a8a9a; position: relative; padding: 4px 0 0; }
    .pv.pv-dark { --bg: #1c1c26; --fg: #f1f1f6; --log: #13131a; --bub: #272733; --line2: #34344a; --mu: #a2a2b6; }
    .pv-panel { background: var(--bg); color: var(--fg); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 34px rgba(15,42,46,.22); font: 14px/1.45 system-ui, sans-serif; }
    .pv-head { background: var(--c); color: var(--on); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .pv-head b { display: block; font-size: 15px; } .pv-head small { display: block; opacity: .85; font-size: 12px; }
    .pv-av { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 700; flex: none; }
    .pv-on { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 5px; }
    .pv-log { background: var(--log); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 230px; }
    .pv-m { max-width: 86%; padding: 8px 12px; border-radius: 15px; overflow-wrap: anywhere; }
    .pv-m.a { background: var(--bub); border: 1px solid var(--line2); border-bottom-left-radius: 5px; align-self: flex-start; }
    .pv-m.u { background: var(--c); color: var(--on); border-bottom-right-radius: 5px; align-self: flex-end; }
    .pv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pv-chips span { border: 1.5px solid var(--c); color: var(--c); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; }
    .pv-dark .pv-chips span { color: var(--fg); }
    .pv-form { display: flex; gap: 8px; align-items: center; padding: 10px; background: var(--bg); border-top: 1px solid var(--line2); }
    .pv-form span { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line2); border-radius: 12px; color: var(--mu); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-form b { background: var(--c); color: var(--on); border-radius: 12px; padding: 8px 14px; font-size: 14px; }
    .pv-pw { text-align: center; font-size: 11px; padding: 5px; color: var(--mu); background: var(--bg); }
    .pv-dock { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; }
    .pv-dock.r { justify-content: flex-end; } .pv-dock.l { justify-content: flex-start; flex-direction: row-reverse; }
    .pv-teaser { max-width: 220px; background: var(--bg); color: var(--fg); border-radius: 16px 16px 4px 16px; padding: 9px 13px; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(15,42,46,.2); }
    .pv-dock.l .pv-teaser { border-radius: 16px 16px 16px 4px; }
    .pv-fab { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 54px; min-width: 54px; border-radius: 999px; background: var(--c); color: var(--on); box-shadow: 0 8px 22px rgba(0,0,0,.25); font: 700 14.5px system-ui, sans-serif; }
    .pv-fab.wide { padding: 0 20px 0 16px; }
    .kb-meter { margin-top: 12px; }
    .kb-meter .bar { margin-top: 6px; }
    .kb-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px; margin-bottom: 4px; }
    .kb-meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; font-weight: 600; }
    .kb-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .kb-tools input[type=search] { flex: 1; min-width: 180px; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 999px; font: inherit; background: #fff; }
    .doc-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-soft); }
    .url-row { display: flex; gap: 8px; }
    .url-row input { flex: 1; min-width: 0; }
    @media (max-width: 560px) { .save-bar { margin: 20px -16px -16px; padding: 12px 16px; } .row-edit { flex-wrap: wrap; } }
    .conv { border-top: 1px solid var(--line); padding: 10px 0; }
    .conv summary { cursor: pointer; font-weight: 600; }
    .conv .tm { margin-top: 8px; }
    .conv[open] { display: block; } .conv[open] > .tm { display: block; }

    .view > h1 { margin-bottom: 4px; }
    .view > .lead { color: var(--ink-soft); margin-bottom: 22px; }
    .view:focus { outline: none; }

    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
    .stat { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; }
    .stat .label { font-size: .9rem; color: var(--ink-soft); }
    .stat .value { margin-top: 4px; font: 800 1.7rem/1.15 var(--display); letter-spacing: -0.02em; }
    .stat .sub { margin-top: 4px; font-size: .88rem; color: var(--ink-soft); }
    .bar { height: 10px; border-radius: 999px; background: var(--mist); overflow: hidden; margin-top: 10px; }
    .bar > span { display: block; height: 100%; background: var(--lagoon); border-radius: 999px; }
    .bar.high > span { background: #C77700; }
    .bar.full > span { background: var(--danger); }

    .steps { list-style: none; }
    .steps li { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
    .steps li:first-child { border-top: none; padding-top: 4px; }
    .tick { flex: none; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; }
    .steps li.done .tick { background: var(--ok); border-color: var(--ok); }
    .steps li.done .step-title { text-decoration: line-through; color: var(--ink-soft); }
    .step-title { font-weight: 700; }
    .step-actions { margin-top: 8px; }

    .doc-list { list-style: none; }
    .doc { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
    .doc:first-child { border-top: none; }
    .doc-main { min-width: 0; }
    .doc-title { font-weight: 700; overflow-wrap: anywhere; }
    .doc-snippet { color: var(--ink-soft); font-size: .93rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .doc-actions { display: flex; gap: 8px; flex: none; }
    .empty { text-align: center; padding: 28px 12px; color: var(--ink-soft); }
    .page-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }

    .interval { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 18px; font-weight: 600; color: var(--ink-soft); }
    .interval .on { color: var(--ink); }
    .switch { position: relative; width: 56px; height: 32px; flex: none; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
    .switch[aria-checked="true"] { background: var(--sun); }
    .switch[aria-checked="true"]::after { transform: translateX(24px); }
    .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .plan { display: flex; flex-direction: column; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 20px; }
    .plan.current { border-color: var(--lagoon); box-shadow: 0 0 0 3px rgba(14,124,123,.15); }
    .plan .price { margin: 10px 0 2px; font: 800 2.2rem/1 var(--display); letter-spacing: -0.03em; }
    .plan .price small { font: 500 .95rem var(--body); color: var(--ink-soft); letter-spacing: 0; }
    .plan ul { list-style: none; margin: 14px 0 18px; flex: 1; font-size: .95rem; }
    .plan li { padding: 3px 0 3px 22px; position: relative; }
    .plan li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 11px; height: 6px; border-left: 2.5px solid var(--lagoon); border-bottom: 2.5px solid var(--lagoon); transform: rotate(-45deg); }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); }
    th { font-weight: 600; color: var(--ink-soft); border-top: none; }
    td:first-child, td:last-child { white-space: nowrap; }
    .table-scroll { overflow-x: auto; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .danger-zone { border-color: #E9B7B1; }
    .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--ink-soft); }

    @media (max-width: 899px) {
      .shell { display: block; padding-top: 22px; padding-bottom: 96px; }
      .side { display: none; }
      .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
      .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 58px; font-size: .7rem; font-weight: 600; color: var(--ink-soft); text-decoration: none; gap: 2px; }
      .tabbar a[aria-current="page"] { color: var(--lagoon-dark); box-shadow: inset 0 3px 0 var(--lagoon); }
      .tabbar svg { width: 22px; height: 22px; }
      .stats, .plans { grid-template-columns: minmax(0, 1fr); }
      .row-2 { grid-template-columns: 1fr; }
      .topbar-links .hide-sm { display: none; }
    }
    .lm-back { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 20px 14px; overflow-y: auto; background: rgba(15,42,46,.6); }
    .lm { position: relative; width: 100%; max-width: 480px; margin: auto; background: #fff; border-radius: 22px; padding: 26px 20px 22px; box-shadow: 0 20px 60px rgba(15,42,46,.35); }
    .lm h2 { font: 800 1.45rem/1.2 var(--display); letter-spacing: -.02em; margin: 0 28px 6px 0; }
    .lm .lm-sub { color: var(--ink-soft); margin-bottom: 16px; }
    .lm-x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--mist); color: var(--ink); font-size: 1.3rem; cursor: pointer; }
    .lm-int { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 14px; font-weight: 600; color: var(--ink-soft); }
    .lm-int .on { color: var(--ink); }
    .lm-plan { position: relative; border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; margin-bottom: 12px; background: #fff; }
    .lm-plan.hot { border: 2.5px solid var(--lagoon); background: #F2FAF8; box-shadow: 0 6px 20px rgba(14,124,123,.18); padding-top: 22px; }
    .lm-badge { position: absolute; top: -13px; left: 14px; background: var(--sun); color: var(--ink); font: 800 .78rem var(--body); padding: 5px 12px; border-radius: 999px; }
    .lm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .lm-head h3 { font: 800 1.2rem var(--display); margin: 0; }
    .lm-price { font: 800 1.5rem var(--display); }
    .lm-price small { font: 500 .9rem var(--body); color: var(--ink-soft); }
    .lm-for { color: var(--ink-soft); font-size: .92rem; margin: 2px 0 8px; }
    .lm-rows { list-style: none; margin: 0 0 12px; padding: 0; }
    .lm-rows li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .95rem; }
    .lm-rows li span:first-child { color: var(--ink-soft); }
    .lm-rows li b.up { color: var(--lagoon-dark); }
    .lm-rows li b.up::before { content: "\2191 "; }
    .lm-rows li.now b { color: var(--ink-soft); font-weight: 600; }
    .lm-note { text-align: center; font-size: .85rem; color: var(--ink-soft); margin: 4px 0 8px; }
    .lm-later { display: block; margin: 0 auto; background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font: inherit; cursor: pointer; padding: 8px; }
    .lm-err { color: var(--danger); font-size: .9rem; text-align: center; margin: 6px 0; }
    .hd-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .hd-filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
    .hd-chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; min-height: 40px; padding: 0 14px; font: 600 .92rem var(--body); color: var(--ink); cursor: pointer; }
    .hd-chip b { margin-left: 4px; color: var(--ink-soft); }
    .hd-chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); } .hd-chip[aria-pressed="true"] b { color: #CFE0DC; }
    .hd-table { border-top: 1px solid var(--line); }
    .hd-row { border-bottom: 1px solid var(--line); }
    .hd-main { display: grid; grid-template-columns: 120px 110px minmax(0,1fr) 84px; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 14px 4px; cursor: pointer; font: inherit; color: inherit; }
    .hd-main:hover { background: var(--mist); } .hd-main:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
    .hd-what b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hd-what small { display: block; color: var(--ink-soft); font-size: .86rem; } .hd-what small.hd-problem { color: var(--danger); font-weight: 600; }
    .hd-who { font-weight: 600; } .hd-when { text-align: right; }
    .hd-thread { padding: 4px 4px 16px; display: flex; flex-direction: column; gap: 8px; }
    .hd-pulse { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; background: #1fb866; box-shadow: 0 0 0 0 rgba(31,184,102,.6); animation: hdPulse 1.6s infinite; vertical-align: middle; }
    @keyframes hdPulse { 70% { box-shadow: 0 0 0 9px rgba(31,184,102,0); } 100% { box-shadow: 0 0 0 0 rgba(31,184,102,0); } }
    .hd-topics { list-style: none; display: grid; gap: 8px; margin-top: 12px; }
    .hd-topics li { position: relative; display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); overflow: hidden; }
    .hd-bar { position: absolute; left: 0; top: 0; bottom: 0; background: #DCEEEA; z-index: 0; }
    .hd-tn, .hd-tc { position: relative; z-index: 1; } .hd-tc { font-weight: 700; }
    @media (max-width: 700px) { .hd-main { grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "s w" "t t"; row-gap: 6px; } .hd-main .status-pill { grid-area: s; justify-self: start; } .hd-when { grid-area: w; } .hd-who { display: none; } .hd-what { grid-area: t; } }
    @media (prefers-reduced-motion: reduce) { .hd-pulse { animation: none; } }
    .hd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .g-box { margin: 4px 0 6px; } #gBtn { display: flex; justify-content: center; min-height: 44px; }
    .or-line { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; color: var(--ink-soft); font-size: .9rem; }
    .or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  </style>

<script>
(function () {
  "use strict";

  /* ---------- configuration ---------- */
  const API = "https://bubble5.mlgcostello.workers.dev";
  const TURNSTILE_SITE_KEY = "0x4AAAAAAFpSUJeJCnZzIYfw"; // paste your Cloudflare Turnstile site key to switch the captcha on
  const STRIPE_PORTAL_LOGIN = "https://billing.stripe.com/p/login/cNi3cu2YkdAs0aR8uv3cc00";
  const PLAN_INFO = {
    starter: { name: "Starter", monthly: 29, annual: 23, features: ["1 chatbot agent", "Up to 1,000 chats a month", "50 documents, 1 million characters", "Email support"] },
    pro: { name: "Pro", monthly: 79, annual: 63, features: ["3 chatbot agents", "Up to 10,000 chats a month", "250 documents, 3 million characters", "Remove the Bubble5 badge", "Priority support"] },
    enterprise: { name: "Enterprise", monthly: 199, annual: 159, features: ["Unlimited chatbot agents", "Unlimited chats", "Dedicated AI backend", "24/7 account manager"] }
  };

  /* ---------- tiny helpers ---------- */
  const root = document.getElementById("root");
  const tabbar = document.getElementById("tabbar");
  const logoutBtn = document.getElementById("logoutBtn");
  let memoryToken = "";
  let state = { me: null, billingInterval: "monthly", docs: null };

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function getToken() { try { return localStorage.getItem("b5_token") || memoryToken; } catch (e) { return memoryToken; } }
  function setToken(t) { memoryToken = t || ""; try { if (t) localStorage.setItem("b5_token", t); else localStorage.removeItem("b5_token"); } catch (e) { /* storage unavailable */ } }
  function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z"); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
  function money(n, cur) { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD" }).format(n); } catch (e) { return "$" + n; } }
  function supportLink(msg) { return "index.html?msg=" + encodeURIComponent(msg) + "#contact"; }
  function notice(kind, text) { return `<div class="notice ${kind}" role="${kind === "err" ? "alert" : "status"}">${text}</div>`; }

  async function api(method, path, body) {
    const headers = { "Content-Type": "application/json" };
    const t = getToken();
    if (t) headers.Authorization = "Bearer " + t;
    let res;
    try {
      res = await fetch(API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    } catch (e) {
      const err = new Error("We couldn't reach the server. Check your connection and try again.");
      err.network = true;
      throw err;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || "Something went wrong. Please try again.");
      err.status = res.status;
      err.code = data.code;
      if (res.status === 401 && t && path !== "/auth/login") { setToken(""); state.me = null; location.hash = "#/login?expired=1"; }
      throw err;
    }
    return data;
  }

  /* ---------- captcha (optional) ---------- */
  let tsWidget = null;
  function loadTurnstile(cb) {
    if (TURNSTILE_SITE_KEY.includes("REPLACE-ME")) return;
    if (window.turnstile) return cb();
    if (document.getElementById("tsScript")) return;
    const s = document.createElement("script");
    s.id = "tsScript"; s.async = true;
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.onload = cb;
    document.head.appendChild(s);
  }
  function mountTurnstile() {
    const box = document.getElementById("tsBox");
    if (!box || TURNSTILE_SITE_KEY.includes("REPLACE-ME")) return;
    loadTurnstile(() => { tsWidget = window.turnstile.render(box, { sitekey: TURNSTILE_SITE_KEY }); });
  }
  function tsToken() { return tsWidget !== null && window.turnstile ? window.turnstile.getResponse(tsWidget) : ""; }
  function tsReset() { if (tsWidget !== null && window.turnstile) window.turnstile.reset(tsWidget); }

  /* ---------- routing ---------- */
  function parseRoute() {
    const raw = (location.hash || "").replace(/^#\/?/, "");
    const [name, query] = raw.split("?");
    return { name: name || "", params: new URLSearchParams(query || "") };
  }

  /* ---------- out-of-chats popup ---------- */
  const LIMIT_ROWS = [
    ["Chats a month", { none: 50, starter: 1000, pro: 10000, enterprise: "Unlimited" }],
    ["Knowledge documents", { none: 10, starter: 50, pro: 250, enterprise: 1000 }],
    ["Knowledge size (characters)", { none: 150000, starter: 1000000, pro: 3000000, enterprise: 5000000 }],
    ["Web page imports a month", { none: 3, starter: 30, pro: 150, enterprise: 500 }],
    ["Custom instructions (characters)", { none: 600, starter: 2000, pro: 4000, enterprise: 8000 }],
    ["Remove Bubble5 badge", { none: "No", starter: "No", pro: "Yes", enterprise: "Yes" }],
    ["Chatbot agents", { none: 1, starter: 1, pro: 3, enterprise: "Unlimited" }],
    ["Support", { none: "Email", starter: "Email", pro: "Priority", enterprise: "24/7 manager" }]
  ];
  const LIMIT_TAGS = { starter: "Great for solo businesses", pro: "For growing teams with more customers", enterprise: "For larger businesses" };
  function fmtVal(v) { return typeof v === "number" ? v.toLocaleString() : v; }
  function maybeShowLimitModal() {
    const me = state.me; if (!me || !me.usage || me.usage.limit === null) return;
    const hasPlan = ["active", "trialing", "past_due"].includes(me.user.status) && me.user.plan !== "none";
    if (hasPlan || me.usage.chats < me.usage.limit) return;
    try { if (sessionStorage.getItem("limitModalSeen") === "1") return; } catch (e) { /* ignore */ }
    if (document.getElementById("limitModal")) return;
    const opener = document.activeElement;
    const back = document.createElement("div"); back.className = "lm-back"; back.id = "limitModal";
    function draw() {
      const annual = state.billingInterval === "annual";
      back.innerHTML = `<div class="lm" role="dialog" aria-modal="true" aria-labelledby="lmT">
        <button type="button" class="lm-x" id="lmX" aria-label="Close">&times;</button>
        <h2 id="lmT">You've used your ${me.usage.limit.toLocaleString()} free chats</h2>
        <p class="lm-sub">Your chatbot can't answer new customer questions until you choose a plan. Pick one to switch it back on.</p>
        <div class="lm-int"><span class="${annual ? "" : "on"}">Monthly</span><button type="button" class="switch" id="lmSw" role="switch" aria-checked="${annual}" aria-label="Bill annually"></button><span class="${annual ? "on" : ""}">Annual <span class="status-pill ok">Save 20%</span></span></div>
        ${Object.entries(PLAN_INFO).map(([id, p]) => `<div class="lm-plan ${id === "starter" ? "hot" : ""}">
          ${id === "starter" ? '<span class="lm-badge">&#9733; Most popular for solo businesses</span>' : ""}
          <div class="lm-head"><h3>${p.name}</h3><div class="lm-price">$${annual ? p.annual : p.monthly}<small>/mo</small></div></div>
          <p class="lm-for">${LIMIT_TAGS[id]}</p>
          <ul class="lm-rows">${LIMIT_ROWS.map(([label, vals]) => {
            const better = JSON.stringify(vals[id]) !== JSON.stringify(vals.none);
            return `<li><span>${label}</span><b class="${better ? "up" : ""}">${fmtVal(vals[id])}</b></li>`;
          }).join("")}</ul>
          ${id === "enterprise" ? `<a class="btn btn-outline btn-block" href="${supportLink("I'm interested in the Enterprise plan for " + (me.user.company || "my company") + ".")}">Contact sales</a>`
            : `<button type="button" class="btn ${id === "starter" ? "btn-primary" : "btn-outline"} btn-block" data-lm-plan="${id}">Choose ${p.name}</button>`}</div>`).join("")}
        <p class="lm-note">Your free trial: 50 chats, 10 documents, 1 agent. Arrows mark what you gain. Cancel any time.</p>
        <div class="lm-err" id="lmErr" role="alert"></div>
        <button type="button" class="lm-later" id="lmLater">Not now</button></div>`;
      back.querySelector("#lmSw").onclick = () => { state.billingInterval = annual ? "monthly" : "annual"; draw(); };
      back.querySelectorAll("[data-lm-plan]").forEach((b) => b.onclick = async () => {
        b.disabled = true; const old = b.textContent; b.textContent = "Opening checkout";
        try { const out = await api("POST", "/billing/checkout", { plan: b.dataset.lmPlan, interval: state.billingInterval, return_url: location.origin + location.pathname }); location.href = out.url; }
        catch (e) { b.disabled = false; b.textContent = old; if (e.code === "billing_not_ready") { close(); location.hash = "#/billing"; } else back.querySelector("#lmErr").textContent = e.message; }
      });
      back.querySelector("#lmX").onclick = close; back.querySelector("#lmLater").onclick = close;
      const f = back.querySelector("[data-lm-plan=starter]"); if (f) f.focus({ preventScroll: true });
    }
    function close() { try { sessionStorage.setItem("limitModalSeen", "1"); } catch (e) { /* ignore */ } document.removeEventListener("keydown", onKey); back.remove(); document.body.style.overflow = ""; if (opener && opener.focus) opener.focus(); }
    function onKey(e) {
      if (e.key === "Escape") return close();
      if (e.key === "Tab") { const els = back.querySelectorAll("button:not([disabled]), a[href]"); if (!els.length) return; const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    back.addEventListener("click", (e) => { if (e.target === back) close(); });
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    document.body.appendChild(back); draw();
  }

  async function route() {
    clearInterval(liveTimer);
    const { name, params } = parseRoute();
    const authed = !!getToken();
    if (!authed) {
      tabbar.hidden = true; logoutBtn.hidden = true; state.me = null; stopUnread();
      if (name === "forgot") return renderForgot();
      if (name === "reset") return renderReset(params.get("token") || "");
      return renderAuth(name === "signup" ? "signup" : "login", params);
    }
    if (name === "login" || name === "signup" || name === "") { location.hash = "#/dashboard"; return; }
    logoutBtn.hidden = false;
    if (!state.me) {
      renderLoading();
      try { state.me = await api("GET", "/me"); }
      catch (e) { if (e.status === 401) return; return renderError(e.message); }
    }
    startUnread();
    const views = { dashboard: renderDashboard, knowledge: renderKnowledge, chatbot: renderChatbot, inbox: renderInbox, live: renderLive, billing: renderBilling, settings: renderSettings };
    const view = views[name];
    if (!view) { location.hash = "#/dashboard"; return; }
    renderShell(name);
    const main = document.getElementById("view");
    main.innerHTML = '<div class="loading"><span class="spinner"></span> Loading</div>';
    try { await view(main, params); }
    catch (e) { if (e.status !== 401) main.innerHTML = notice("err", esc(e.message)); }
    main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    if (name !== "billing") maybeShowLimitModal();
  }

  function renderLoading() { root.innerHTML = '<div class="wrap"><div class="loading"><span class="spinner"></span> Loading your account</div></div>'; }
  function renderError(msg) { root.innerHTML = '<div class="wrap" style="padding-top:28px">' + notice("err", esc(msg)) + '<button class="btn btn-primary" id="retry">Try again</button></div>'; document.getElementById("retry").onclick = route; }

  function renderShell(active) {
    const links = [["dashboard", "Dashboard"], ["knowledge", "Knowledge base"], ["chatbot", "Your chatbot"], ["inbox", "Helpdesk"], ...(state.me && state.me.admin ? [["live", "Live chat"]] : []), ["billing", "Billing"], ["settings", "Account settings"]];
    root.innerHTML = `<div class="wrap shell">
      <aside class="side" aria-label="Portal">${links.map(([r, t]) => `<a href="#/${r}" ${r === active ? 'aria-current="page"' : ""}>${t}</a>`).join("")}
        <a href="help.html">Help and diagnostics</a></aside>
      <section class="view" id="view" tabindex="-1"></section></div>`;
    tabbar.hidden = false;
    tabbar.querySelectorAll("a").forEach((a) => { if (a.dataset.route === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.title = "Bubble5 | " + (links.find((l) => l[0] === active) || ["", "Portal"])[1];
  }

  /* ---------- Continue with Google (only appears once the Worker has a GOOGLE_CLIENT_ID) ---------- */
  let gClientId = null;
  async function googleClientId() {
    if (gClientId !== null) return gClientId;
    try { gClientId = (await api("GET", "/auth/config")).google_client_id || ""; } catch (e) { gClientId = ""; }
    return gClientId;
  }
  function loadGsi(done) {
    if (window.google && google.accounts && google.accounts.id) return done();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.defer = true; s.onload = done; document.head.appendChild(s);
  }
  async function mountGoogle(signup) {
    const id = await googleClientId(), box = document.getElementById("gBox");
    if (!id || !box) return;
    loadGsi(() => {
      const btn = document.getElementById("gBtn"); if (!btn || !window.google) return;
      google.accounts.id.initialize({
        client_id: id, ux_mode: "popup",
        callback: async (resp) => {
          const msg = document.getElementById("authMsg"); if (msg) msg.innerHTML = "";
          try { const out = await api("POST", "/auth/google", { credential: resp.credential }); setToken(out.token); state.me = null; location.hash = "#/dashboard"; }
          catch (err) { if (msg) msg.innerHTML = notice("err", esc(err.message)); }
        }
      });
      google.accounts.id.renderButton(btn, { theme: "outline", size: "large", shape: "pill", text: signup ? "signup_with" : "signin_with", logo_alignment: "left", width: 340 });
      box.hidden = false;
    });
  }

  /* ---------- sign in / sign up ---------- */
  function renderAuth(mode, params) {
    const signup = mode === "signup";
    document.title = "Bubble5 | " + (signup ? "Create account" : "Log in");
    root.innerHTML = `<div class="auth-wrap"><div class="auth-card">
      <h1>${signup ? "Create your business account" : "Welcome back"}</h1>
      <p class="muted">${signup ? "Set up your account, add your business information and choose a plan." : "Log in to manage your chatbot, knowledge base and billing."}</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="${!signup}" data-mode="login">Log in</button>
        <button type="button" role="tab" aria-selected="${signup}" data-mode="signup">Create account</button>
      </div>
      <div id="authMsg">${params.get("expired") ? notice("info", "Your session ended. Please log in again.") : params.get("reset") ? notice("ok", "Password changed. Log in with your new password.") : ""}</div>
      <div class="g-box" id="gBox" hidden><div id="gBtn"></div><div class="or-line"><span>or</span></div></div>
      <form id="authForm" novalidate>
        ${signup ? `<div class="form-group"><label for="aName">Your name</label><input id="aName" autocomplete="name" required></div>` : ""}
        <div class="form-group"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" required></div>
        ${signup ? `<div class="form-group"><label for="aCompany">Company name <span class="muted">(optional)</span></label><input id="aCompany" autocomplete="organization"></div>` : ""}
        <div class="form-group"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="${signup ? "new-password" : "current-password"}" required>
          ${signup ? '<p class="hint">At least 8 characters.</p>' : ""}</div>
        ${signup ? '<div id="tsBox" style="margin-bottom:16px"></div>' : ""}
        <button class="btn btn-primary btn-block" type="submit" id="authBtn">${signup ? "Create account" : "Log in"}</button>
      </form>
      <p class="small muted" style="margin-top:16px">${signup ? "By creating an account you agree to be contacted about your Bubble5 setup." : `<a href="#/forgot">Forgot your password?</a>`}</p>
    </div></div>`;
    root.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { location.hash = "#/" + b.dataset.mode; }));
    if (signup) mountTurnstile();
    mountGoogle(signup);
    const form = document.getElementById("authForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("authMsg");

  /* ---------- file reading helpers ---------- */
  function splitText(text, max) {
    text = String(text || "").trim();
    if (text.length <= max) return [text];
    const parts = []; let buf = "";
    for (const para of text.split(/\n{2,}/)) {
      let p = para;
      while (p.length > max) { if (buf) { parts.push(buf); buf = ""; } parts.push(p.slice(0, max)); p = p.slice(max); }
      if ((buf ? buf.length + 2 : 0) + p.length > max) { parts.push(buf); buf = p; } else buf = buf ? buf + "\n\n" + p : p;
    }
    if (buf) parts.push(buf);
    return parts.filter((x) => x.trim());
  }
  const PDFJS_VER = "6.2.108";
  let pdfjsPromise = null;
  function loadPdfjs() {
    if (!pdfjsPromise) pdfjsPromise = import("https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VER + "/build/pdf.min.mjs").then((m) => {
      m.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VER + "/build/pdf.worker.min.mjs"; return m;
    });
    return pdfjsPromise;
  }
  async function pdfToText(file) {
    const pdfjs = await loadPdfjs();
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const content = await (await pdf.getPage(i)).getTextContent();
      let line = "", out = "";
      for (const it of content.items) { line += it.str; if (it.hasEOL) { out += line.trim() + "\n"; line = ""; } else if (it.str && !/\s$/.test(it.str)) line += " "; }
      out += line.trim();
      pages.push(out.replace(/[ \t]+/g, " ").trim());
    }
    return pages.filter(Boolean).join("\n\n");
  }

    const $ = (id) => document.getElementById(id);

    showTab("basics");

    /* starter questions and quick answers editors */
    function drawStarters() {
      $("stList").innerHTML = starters.map((s, i) => `<div class="row-edit"><input data-st="${i}" maxlength="60" value="${esc(s)}" aria-label="Starter question ${i + 1}" placeholder="What are your opening hours?"><button type="button" class="btn btn-danger btn-small" data-st-del="${i}" aria-label="Remove starter question ${i + 1}">Remove</button></div>`).join("");

      $("stList").querySelectorAll("[data-st]").forEach((i) => i.oninput = () => { starters[+i.dataset.st] = i.value; markDirty(); });
      $("stList").querySelectorAll("[data-st-del]").forEach((b) => b.onclick = () => { starters.splice(+b.dataset.stDel, 1); drawStarters(); markDirty(); });
    }
    $("stAdd").onclick = () => { if (starters.length < L.starters) { starters.push(""); drawStarters(); markDirty(); const i = $("stList").querySelectorAll("input"); i[i.length - 1].focus(); } };
    $("stSuggest").onclick = () => { starters = O.default_starters.slice(0, L.starters); drawStarters(); markDirty(); };
    drawStarters();

    function drawFaqs() {
      $("faqList").innerHTML = faqs.map((f, i) => `<div class="faq-edit"><input data-fq="${i}" maxlength="200" value="${esc(f.q)}" aria-label="Question ${i + 1}" placeholder="Question, e.g. Do you offer gift cards?">
        <textarea data-fa="${i}" maxlength="1200" rows="2" aria-label="Answer ${i + 1}" placeholder="The answer your chatbot should give">${esc(f.a)}</textarea>
        <button type="button" class="btn btn-danger btn-small" data-fq-del="${i}" aria-label="Remove quick answer ${i + 1}">Remove</button></div>`).join("");
      $("faqCount").textContent = `${faqs.length} of ${L.faqs}`;

      $("faqList").querySelectorAll("[data-fq]").forEach((i) => i.oninput = () => { faqs[+i.dataset.fq].q = i.value; markDirty(); });
      $("faqList").querySelectorAll("[data-fa]").forEach((i) => i.oninput = () => { faqs[+i.dataset.fa].a = i.value; markDirty(); });

    $("faqAdd").onclick = () => { if (faqs.length < L.faqs) { faqs.push({ q: "", a: "" }); drawFaqs(); markDirty(); const i = $("faqList").querySelectorAll("input"); i[i.length - 1].focus(); } };

    /* live preview, drawn from the form so it matches what the widget will do */
    function renderPreview() {
      const color = val("bColor"), ink = inkFor(color), dark = picked("theme") === "dark", right = picked("position") !== "left";
      const name = val("bName").trim() || "Assistant";
      const avatar = Array.from(val("bAvatar").trim()).slice(0, 2).join("") || name.charAt(0).toUpperCase();
      const sub = val("bSub").trim() || "Online · replies instantly";
      const list = !$("bShowStart").checked ? [] : (starters.map((s) => s.trim()).filter(Boolean).length ? starters.map((s) => s.trim()).filter(Boolean) : O.default_starters).slice(0, L.starters);
      const faq = faqs.find((f) => f.q.trim() && f.a.trim()) || DEFAULT_SAMPLE;
      const label = picked("launcher") === "label" && val("bLabel").trim();
      const teaserMode = picked("teaser");
      const teaser = teaserMode === "off" ? "" : teaserMode === "custom" && val("bTeaser").trim() ? val("bTeaser").trim() : "👋 Got a question? Ask me, I reply instantly, any time.";
      const hide = L.white_label && $("bHide").checked;
      $("pv").innerHTML = `<div class="pv ${dark ? "pv-dark" : ""}" style="--c:${esc(color)};--on:${ink}">
        <div class="pv-panel"><div class="pv-head"><span class="pv-av">${esc(avatar)}</span><span><b>${esc(name)}</b><small><i class="pv-on"></i>${esc(sub)}</small></span></div>
          <div class="pv-log"><div class="pv-m a">${esc(val("bGreet").trim() || "Hi! How can I help you today?")}</div>
            ${list.length ? `<div class="pv-chips">${list.map((s) => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
            <div class="pv-m u">${esc(faq.q)}</div><div class="pv-m a">${esc(faq.a)}</div></div>
          <div class="pv-form"><span>${esc(val("bPlace").trim() || "Type your question…")}</span><b>Send</b></div>

        <div class="pv-dock ${right ? "r" : "l"}">${teaser ? `<div class="pv-teaser">${esc(teaser)}</div>` : ""}
          <span class="pv-fab ${label ? "wide" : ""}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>${label ? `<span>${esc(val("bLabel").trim())}</span>` : ""}</span></div></div>`;
    }
    el.querySelector("#botForm").addEventListener("input", markDirty);
    el.querySelector("#botForm").addEventListener("change", markDirty);
    dirty = true; markDirty(); dirty = false; $("dirty").textContent = "";

    /* save */
    $("botForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("saveBot"); btn.disabled = true; msg.innerHTML = "";
      const cleanStarters = starters.map((s) => s.trim()).filter(Boolean);
      const cleanFaqs = faqs.map((f) => ({ q: f.q.trim(), a: f.a.trim() })).filter((f) => f.q && f.a);
      if (faqs.some((f) => (f.q.trim() && !f.a.trim()) || (!f.q.trim() && f.a.trim()))) { msg.innerHTML = notice("warn", "Each quick answer needs both a question and an answer. Fill in or remove the unfinished ones."); showTab("talk"); btn.disabled = false; return; }
      try {
        const out = await api("PATCH", "/bot", {
          name: val("bName"), business: val("bBiz"), greeting: val("bGreet"), tone: picked("tone"), color: val("bColor"),
          handoff_email: val("bMail"), allowed_domains: val("bDom"), enabled: $("bOn").checked,
          settings: {
            instructions: val("bInstr"), length: picked("length"), emoji: picked("emoji"), language: val("bLang"), fallback: val("bFallback"),
            show_starters: $("bShowStart").checked, starters: cleanStarters, faqs: cleanFaqs,
            position: picked("position"), theme: picked("theme"), avatar: val("bAvatar"), launcher: picked("launcher"), launcher_label: val("bLabel"),
            teaser: picked("teaser"), teaser_text: val("bTeaser"), placeholder: val("bPlace"), subtitle: val("bSub"), hide_branding: L.white_label && $("bHide").checked
          }
        });
        bot = out.bot; S = out.settings; starters = S.starters.slice(); faqs = S.faqs.map((f) => ({ q: f.q, a: f.a }));
        drawStarters(); drawFaqs(); dirty = false; $("dirty").textContent = "";

    $("copySnip").onclick = async (e) => {

        const j = await res.json();
        if (res.ok) { w.textContent = j.answer; hist.push({ role: "assistant", content: j.answer }); } else { w.textContent = j.message || j.error; hist.pop(); }

  /* ---------- inbox: conversations, unanswered questions, leads ---------- */
  /* ---------- helpdesk: problems and who is chatting right now ---------- */
  const TOPICS = [
    ["Pricing and payments", /\b(price|prices|pricing|cost|how much|fee|fees|pay|payment|paid|refund|invoice|charge|charged|discount|deposit|\$|€|£)\b/i],
    ["Opening hours and location", /\b(open|opening|close|closing|hours|address|where|location|directions|parking|find you|today|tomorrow|weekend|sunday|saturday)\b/i],
    ["Bookings and availability", /\b(book|booking|reserve|reservation|appointment|schedule|available|availability|quote|slot|table for)\b/i],
    ["Products and services", /\b(menu|product|products|service|services|size|sizes|stock|ingredient|ingredients|vegan|gluten|allerg\w*|have you got|do you (have|sell|offer))\b/i],
    ["Delivery and orders", /\b(deliver|delivery|shipping|ship|order|orders|track|tracking|pickup|collect)\b/i],
    ["Problems and complaints", /\b(problem|issue|broken|not working|doesn'?t work|error|wrong|late|cancel|cancelled|complain|disappointed|damaged|missing)\b/i]
  ];
  function topicOf(text) { for (const [name, re] of TOPICS) if (re.test(text)) return name; return "Other questions"; }
  function utcMs(iso) { return iso ? new Date(String(iso).replace(" ", "T") + "Z").getTime() : 0; }

  async function renderInbox(el) {
    const hd = { filter: "all", open: new Set(), conv: null, leads: null };
    el.innerHTML = `<h1>Helpdesk</h1><p class="lead">Every visitor conversation, who needs you, and who is chatting right now.</p><div id="hdBody"><div class="loading"><span class="spinner"></span> Loading</div></div>`;
    const body = document.getElementById("hdBody");

    function ticketOf(c) {
      const first = (c.messages.find((m) => m.role === "user") || c.messages[0] || { content: "" }).content;
      const prob = c.messages.find((m) => m.unanswered);
      let probQ = "";
      if (prob) { const i = c.messages.indexOf(prob); for (let k = i - 1; k >= 0; k--) if (c.messages[k].role === "user") { probQ = c.messages[k].content; break; } }
      const lastMs = utcMs(c.last), live = Date.now() - lastMs < 3 * 60 * 1000;
      const resolved = c.status === "resolved", hold = c.status === "on_hold";
      const attention = c.unanswered > 0 && !resolved;
      const status = resolved ? "resolved" : hold ? "hold" : live ? "live" : attention ? "attention" : "answered";
      return { c, first, probQ, lastMs, live, status, attention, resolved, hold };
    }
    function draw() {
      const { conv, leads } = hd; if (!conv) return;
      const tickets = conv.conversations.map(ticketOf).sort((a, b) => (b.live - a.live) || (b.attention - a.attention) || (b.lastMs - a.lastMs));
      const liveN = tickets.filter((t) => t.live).length, attN = tickets.filter((t) => t.attention).length;
      const st = conv.stats, answeredPct = st.questions ? Math.round(((st.questions - st.unanswered) / st.questions) * 100) : null;
      const shown = tickets.filter((t) => hd.filter === "all" || (hd.filter === "live" && t.live) || (hd.filter === "attention" && t.attention) || (hd.filter === "hold" && t.hold) || (hd.filter === "resolved" && t.resolved));
      const counts = {}; let totalQ = 0;
      conv.conversations.forEach((c) => c.messages.forEach((m) => { if (m.role === "user" && m.content && m.content !== "(shared an email address)") { const t = topicOf(m.content); counts[t] = (counts[t] || 0) + 1; totalQ++; } }));
      const topics = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const pill = { live: ["ok", "Live now"], attention: ["err", "Needs you"], hold: ["warn", "On hold"], resolved: ["", "Resolved"], answered: ["", "Answered"] };
      body.innerHTML = `
        <div class="stats">
          <div class="stat"><div class="label">Chatting now</div><div class="value">${liveN ? '<span class="hd-pulse" aria-hidden="true"></span>' : ""}${liveN}</div><div class="sub">active in the last 3 minutes</div></div>
          <div class="stat"><div class="label">Need you</div><div class="value">${attN}</div><div class="sub">visitors it could not fully help</div></div>
          <div class="stat"><div class="label">Answered</div><div class="value">${answeredPct === null ? "-" : answeredPct + "%"}</div><div class="sub">${st.questions} question${st.questions === 1 ? "" : "s"} from ${st.visitors} visitor${st.visitors === 1 ? "" : "s"}, 30 days</div></div>
          <div class="stat"><div class="label">Leads captured</div><div class="value">${leads.leads.length}</div><div class="sub">visitors who left their email</div></div>
        </div>
        <div class="card"><div class="hd-head"><h2>Conversations</h2><span class="muted small" aria-live="polite">Updates every 5 seconds</span></div>
          <div class="hd-filters" role="group" aria-label="Filter conversations">
            ${[["all", "All", tickets.length], ["live", "Live now", liveN], ["attention", "Needs you", attN], ["hold", "On hold", tickets.filter((t) => t.hold).length], ["resolved", "Resolved", tickets.filter((t) => t.resolved).length]].map(([k, l, n]) => `<button type="button" class="hd-chip" data-f="${k}" aria-pressed="${hd.filter === k}">${l} <b>${n}</b></button>`).join("")}
          </div>
          ${shown.length ? `<div class="hd-table" role="list">${shown.map((t) => {
            const id = t.c.visitor, open = hd.open.has(id), p = pill[t.status];
            return `<div class="hd-row ${open ? "open" : ""}" role="listitem">
              <button type="button" class="hd-main" data-v="${esc(id)}" aria-expanded="${open}">
                <span class="status-pill ${p[0]}">${t.live ? '<span class="hd-pulse" aria-hidden="true"></span>' : ""}${p[1]}</span>
                <span class="hd-who">Visitor ${esc(id.slice(-4).toUpperCase())}</span>
                <span class="hd-what"><b>${esc((t.attention && t.probQ ? t.probQ : t.first).slice(0, 90))}</b>${t.attention ? `<small class="hd-problem">Could not answer${t.c.unanswered > 1 ? " (" + t.c.unanswered + " questions)" : ""}</small>` : `<small>${t.c.messages.filter((m) => m.role === "user").length} message${t.c.messages.filter((m) => m.role === "user").length === 1 ? "" : "s"}</small>`}</span>
                <span class="hd-when muted small">${esc(ago(t.c.last))}</span>
              </button>
              ${open ? `<div class="hd-thread">${t.c.messages.map((m) => `<div class="tm ${m.role === "user" ? "u" : "a"}${m.unanswered ? " flag" : ""}">${esc(m.content)}</div>`).join("")}${t.attention ? `<p class="muted small">Add the missing answer in <a href="#/knowledge">your knowledge base</a> so it can answer next time.</p>` : ""}<div class="hd-actions">${t.resolved ? `<button type="button" class="btn btn-outline btn-small" data-st="open" data-v="${esc(id)}">Reopen</button>` : `<button type="button" class="btn btn-primary btn-small" data-st="resolved" data-v="${esc(id)}">Mark resolved</button>${t.hold ? `<button type="button" class="btn btn-outline btn-small" data-st="open" data-v="${esc(id)}">Take off hold</button>` : `<button type="button" class="btn btn-outline btn-small" data-st="on_hold" data-v="${esc(id)}">Put on hold</button>`}`}</div></div>` : ""}
            </div>`; }).join("")}</div>`
            : `<div class="empty"><p>${hd.filter === "all" ? "No conversations yet. Try the chatbot, or add it to your website, and visitors will show up here." : "Nothing here right now."}</p></div>`}
        </div>
        <div class="card"><h2>What customers ask about</h2><p class="muted">Grouped automatically by keywords, from the latest conversations.</p>
          ${topics.length ? `<ul class="hd-topics">${topics.map(([n, c]) => `<li><span class="hd-bar" style="width:${Math.max(6, Math.round((c / topics[0][1]) * 100))}%"></span><span class="hd-tn">${esc(n)}</span><span class="hd-tc">${c}</span></li>`).join("")}</ul>` : '<div class="empty"><p>Topics appear after your first conversations.</p></div>'}
        </div>
        <div class="card"><h2>Questions it could not answer</h2><p class="muted">Add these answers to your knowledge base and your chatbot gets better.</p>
          ${conv.unanswered.length ? `<ul class="doc-list">${conv.unanswered.map((u) => `<li class="doc"><div class="doc-main"><div class="doc-title">${esc(u.question)}</div><div class="muted small">asked ${u.n} time${u.n === 1 ? "" : "s"}</div></div></li>`).join("")}</ul><p style="margin-top:14px"><a class="btn btn-outline" href="#/knowledge">Add answers</a></p>` : '<div class="empty"><p>Nothing unanswered. Your chatbot has coped with every question so far.</p></div>'}
        </div>
        <div class="card"><h2>Leads</h2>${leads.leads.length ? `<ul class="doc-list">${leads.leads.map((l) => `<li class="doc"><div class="doc-main"><div class="doc-title">${esc(l.name || "Visitor")} &middot; <a href="mailto:${esc(l.email)}">${esc(l.email)}</a></div><div class="doc-snippet">${esc(l.message || "")}</div><div class="muted small">${esc(fmtDate(l.created_at))}</div></div></li>`).join("")}</ul>` : '<div class="empty"><p>No leads yet. When your chatbot cannot answer, it asks the visitor for their email and it appears here.</p></div>'}</div>`;
      body.querySelectorAll(".hd-chip").forEach((b) => b.onclick = () => { hd.filter = b.dataset.f; draw(); });
      body.querySelectorAll("[data-st]").forEach((b) => b.onclick = async () => {
        b.disabled = true;
        try { await api("PATCH", "/bot/conversations/status", { visitor: b.dataset.v, status: b.dataset.st }); await load(); }
        catch (e) { b.disabled = false; b.textContent = "Could not save, try again"; }
      });
      body.querySelectorAll(".hd-main").forEach((b) => b.onclick = () => { const v = b.dataset.v; hd.open.has(v) ? hd.open.delete(v) : hd.open.add(v); draw(); const nb = body.querySelector('.hd-main[data-v="' + (window.CSS && CSS.escape ? CSS.escape(v) : v) + '"]'); if (nb) nb.focus({ preventScroll: true }); });
    }
    async function load() {
      const [conv, leads] = await Promise.all([api("GET", "/bot/conversations"), hd.leads ? Promise.resolve(hd.leads) : api("GET", "/bot/leads")]);
      const first = !hd.conv; hd.conv = conv; hd.leads = leads;
      if (first && conv.conversations.some((c) => c.unanswered > 0 && c.status !== "resolved")) hd.filter = "attention"; /* open straight onto the visitors who need you */
      draw();
    }
    await load();
    clearInterval(liveTimer);
    liveTimer = setInterval(() => { if (parseRoute().name !== "inbox" || document.hidden) return; load().catch(() => {}); }, 5000);
  }


  /* ---------- live chat (owner only) ---------- */
  let liveTimer = null, unreadTimer = null;
  function ago(iso) {
    if (!iso) return "";
    const d = new Date(iso.replace(" ", "T") + "Z"); const sec = Math.max(0, (Date.now() - d) / 1000);
    if (sec < 60) return "just now"; if (sec < 3600) return Math.floor(sec / 60) + " min ago"; if (sec < 86400) return Math.floor(sec / 3600) + " h ago";
    return fmtDate(iso);
  }
  function setUnread(n) {
    const b = document.getElementById("liveBadge"); if (!b) return;
    b.textContent = n; b.hidden = !n;
    document.title = document.title.replace(/^\(\d+\) /, "");
    if (n) document.title = "(" + n + ") " + document.title;
  }
  async function pollUnread() {
    try { const d = await api("GET", "/admin/live"); setUnread(d.unread); } catch (e) { /* ignore */ }
  }
  function startUnread() {
    const link = document.getElementById("liveLink");
    if (!state.me || !state.me.admin) { if (link) link.hidden = true; return; }
    link.hidden = false;
    if (!unreadTimer) { pollUnread(); unreadTimer = setInterval(pollUnread, 15000); }
  }
  function stopUnread() { clearInterval(unreadTimer); unreadTimer = null; const l = document.getElementById("liveLink"); if (l) l.hidden = true; setUnread(0); }

  async function renderLive(el, params) {
    if (!state.me.admin) { el.innerHTML = notice("err", "This page is for the Bubble5 owner."); return; }
    const sel = Number(params.get("c")) || 0;
    el.innerHTML = `<h1>Live chat</h1><p class="lead">Messages from visitors on your website. You show as online while this page or the portal is open.</p>
      <div class="live-grid ${sel ? "has-thread" : ""}"><div class="card" id="liveList"></div><div class="card" id="liveThread"></div></div>`;
    const listEl = document.getElementById("liveList"), thEl = document.getElementById("liveThread");
    let lastMsg = 0, built = false;

    async function refreshList() {
      const d = await api("GET", "/admin/live"); setUnread(sel ? 0 : d.unread);
      listEl.innerHTML = `<h2>Conversations</h2>` + (d.chats.length ? d.chats.map((c) => `<button class="lchat" data-id="${c.id}" ${c.id === sel ? 'aria-current="true"' : ""}>
        <div class="top"><span>${c.here ? '<span class="here" title="On the site now"></span>' : ""}${esc(c.name || c.email || "Visitor")}</span>${c.unread_admin ? `<span class="pillbadge">${c.unread_admin}</span>` : `<span class="muted small">${esc(ago(c.last_message_at))}</span>`}</div>
        <div class="snip">${c.last_sender === "agent" ? "You: " : ""}${esc(c.last_body || "")}${c.status === "closed" ? " (closed)" : ""}</div></button>`).join("") : '<div class="empty"><p>No chats yet. When someone uses the Chat with us bubble on your website, it shows up here and you get an email.</p></div>');
      listEl.querySelectorAll(".lchat").forEach((b) => b.onclick = () => { location.hash = "#/live?c=" + b.dataset.id; });
    }
    async function refreshThread() {
      if (!sel) { thEl.innerHTML = '<div class="empty"><p>Pick a conversation.</p></div>'; return; }
      const d = await api("GET", "/admin/live/" + sel + "?after=" + lastMsg);
      if (!built) {
        built = true;
        thEl.innerHTML = `<a class="small" href="#/live" style="display:inline-block;margin-bottom:8px">&larr; All conversations</a>
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h2 id="lhead"></h2><div class="muted small" id="lsub"></div></div><button class="btn btn-outline btn-small" id="lclose">Close chat</button></div>
          <div class="lthread" id="lmsgs" aria-live="polite"></div>
          <form class="lform" id="lform"><textarea id="lbody" rows="1" maxlength="1000" placeholder="Type your reply" aria-label="Your reply"></textarea><button class="btn btn-primary" type="submit">Send</button></form><div id="lmsg" style="margin-top:8px"></div>`;
        document.getElementById("lclose").onclick = async () => { await api("POST", "/admin/live/" + sel + "/close"); location.hash = "#/live"; };
        const ta = document.getElementById("lbody");
        ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("lform").requestSubmit(); } });
        document.getElementById("lform").addEventListener("submit", async (e) => {
          e.preventDefault(); const t = ta.value.trim(); if (!t) return; ta.value = "";
          try { const out = await api("POST", "/admin/live/" + sel, { message: t }); document.getElementById("lmsg").innerHTML = out.emailed ? notice("info", "They are not on the site, so we also emailed your reply.") : ""; await refreshThread(); refreshList(); }
          catch (err) { ta.value = t; document.getElementById("lmsg").innerHTML = notice("err", esc(err.message)); }
        });
        ta.focus();
      }
      document.getElementById("lhead").innerHTML = esc(d.chat.name || "Visitor");
      document.getElementById("lsub").innerHTML = (d.chat.email ? `<a href="mailto:${esc(d.chat.email)}">${esc(d.chat.email)}</a> &middot; ` : "") + (d.chat.here ? "on the site now" : "not on the site") + (d.chat.status === "closed" ? " &middot; closed" : "");
      const box = document.getElementById("lmsgs"); const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      d.messages.forEach((m) => { lastMsg = Math.max(lastMsg, m.id); const div = document.createElement("div"); div.className = "tm " + (m.sender === "note" ? "note" : m.sender === "agent" ? "u" : "a"); div.textContent = m.body; box.appendChild(div); });
      if (stick || d.messages.length && lastMsg === d.messages[d.messages.length - 1].id) box.scrollTop = box.scrollHeight;
    }
    await Promise.all([refreshList(), refreshThread()]);
    liveTimer = setInterval(() => { refreshList().catch(() => {}); refreshThread().catch(() => {}); }, 4000);
  }

  /* ---------- billing ---------- */
  let pollTimer = null;
  async function renderBilling(el, params) {
    const bill = await api("GET", "/billing");
    const u = state.me.user;
    const checkout = params.get("checkout");
    const annual = state.billingInterval === "annual";
    const subscribed = bill.status && ["active", "trialing", "past_due"].includes(bill.status) && bill.plan !== "none";
    let invoices = [];
    if (bill.has_billing) { try { invoices = (await api("GET", "/billing/invoices")).invoices; } catch (e) { invoices = null; } }

    const current = subscribed
      ? `<div class="card"><h2>Your plan</h2>
          <p style="font:800 1.8rem/1.2 var(--display);margin:6px 0">${esc(bill.plan_name)} <span class="muted" style="font:500 1rem var(--body)">${bill.interval === "annual" ? "billed annually" : "billed monthly"}</span></p>
          <p>${statusPill({ status: bill.status })} ${bill.period_end ? `<span class="muted small">${bill.status === "canceled" ? "Ends" : "Renews"} ${esc(fmtDate(bill.period_end))}</span>` : ""}</p>
          <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="portalBtn">Manage billing</button></div>
          <p class="hint">Change plan, update your card, download invoices or cancel in the secure billing portal.</p></div>`
      : `<div class="card"><h2>Your plan</h2><p class="muted" style="margin-bottom:0">You don't have a plan yet. Choose one below to launch your chatbot.</p>${bill.status === "canceled" ? '<p class="small muted" style="margin-top:8px">Your previous subscription has ended.</p>' : ""}</div>`;

    const plans = subscribed ? "" : `<div class="card"><h2>Choose a plan</h2><p class="muted">Change or cancel any time.</p>
      <div class="interval"><span class="${annual ? "" : "on"}">Monthly</span>
        <button type="button" class="switch" id="intervalSwitch" role="switch" aria-checked="${annual}" aria-label="Bill annually"></button>
        <span class="${annual ? "on" : ""}">Annual <span class="status-pill ok">Save 20%</span></span></div>
      <div class="plans">${Object.entries(PLAN_INFO).map(([id, p]) => `<div class="plan ${bill.plan === id ? "current" : ""}"><h3>${p.name}</h3>
        <div class="price">$${annual ? p.annual : p.monthly}<small>/mo</small></div>
        <div class="muted small">${annual ? "Billed annually ($" + p.annual * 12 + "/yr)" : "Billed monthly"}</div>
        <ul>${p.features.map((f) => `<li>${f}</li>`).join("")}</ul>
        ${id === "enterprise" ? `<a class="btn btn-outline btn-block" href="${supportLink("I'm interested in the Enterprise plan for " + (u.company || "my company") + ".")}">Contact sales</a>`
          : `<button class="btn ${id === "pro" ? "btn-primary" : "btn-outline"} btn-block" data-plan="${id}">Choose ${p.name}</button>`}</div>`).join("")}</div></div>`;

    const inv = !bill.has_billing ? "" : `<div class="card"><h2>Invoices</h2>
      ${invoices === null ? '<p class="muted">We couldn\'t load your invoices right now. Try again in a moment.</p>' : !invoices.length ? '<p class="muted">Your invoices will appear here after your first payment.</p>'
        : `<div class="table-scroll"><table><thead><tr><th>Date</th><th>Number</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${invoices.map((i) => `<tr><td>${esc(fmtDate(i.date))}</td><td>${esc(i.number || "")}</td><td>${esc(money(i.amount, i.currency))}</td><td>${esc(i.status || "")}</td><td>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">View</a>` : ""}</td></tr>`).join("")}</tbody></table></div>`}</div>`;

    el.innerHTML = `<h1>Billing</h1><p class="lead">Your plan, payment details and invoices.</p><div id="billMsg">
      ${checkout === "success" ? notice("ok", "Thanks! Your payment went through. Your plan is updating now.") : ""}
      ${checkout === "cancelled" ? notice("info", "Checkout was cancelled. You haven't been charged.") : ""}
      ${bill.status === "past_due" ? notice("warn", "Your last payment failed. Open Manage billing to update your payment method.") : ""}
      ${!bill.billing_ready && !subscribed ? notice("info", `Online payments are still being switched on. To start a plan now, <a href="${supportLink("I'd like to start a Bubble5 plan. Plan: ")}">contact us</a> and we'll set it up by hand.`) : ""}
      </div>${bill.setup_needed ? `<div class="card"><h2>Finish billing setup</h2><p class="muted">Your Stripe key is in. One click creates your three plans, the payment webhook and the customer billing portal in Stripe. Safe to press again.</p><button class="btn btn-primary" id="setupBtn" type="button">Set up Stripe billing</button><div id="setupMsg" style="margin-top:10px"></div></div>` : ""}${current}${plans}${inv}`;

    const msg = document.getElementById("billMsg");
    const sw = document.getElementById("intervalSwitch");
    if (sw) sw.onclick = () => { state.billingInterval = annual ? "monthly" : "annual"; renderBilling(el, params); };
    async function go(path, body, btn, label) {
      btn.disabled = true; const old = btn.textContent; btn.textContent = label;
      try {
        const out = await api("POST", path, { ...body, return_url: location.origin + location.pathname });
        location.href = out.url;
      } catch (err) {
        const text = err.code === "billing_not_ready" ? `Online payments are still being switched on. <a href="${supportLink("I'd like to start a Bubble5 plan. Plan: " + (body.plan || ""))}">Contact us</a> and we'll set up your plan by hand.` : esc(err.message);
        msg.innerHTML = notice(err.code === "billing_not_ready" ? "info" : "err", text);
        btn.disabled = false; btn.textContent = old; window.scrollTo(0, 0);
      }
    }
    el.querySelectorAll("[data-plan]").forEach((b) => b.onclick = () => go("/billing/checkout", { plan: b.dataset.plan, interval: state.billingInterval }, b, "Opening checkout"));
    const sb = document.getElementById("setupBtn");
    if (sb) sb.onclick = async () => {
      sb.disabled = true; sb.textContent = "Setting up\u2026";
      try { const r = await api("POST", "/billing/setup", {}); document.getElementById("setupMsg").innerHTML = notice("ok", "Done: " + esc(r.done.join(", ")) + ". Reloading\u2026"); setTimeout(() => location.reload(), 1200); }
      catch (e) { sb.disabled = false; sb.textContent = "Set up Stripe billing"; document.getElementById("setupMsg").innerHTML = notice("err", esc(e.message)); }
    };
    const pb = document.getElementById("portalBtn");
    if (pb) pb.onclick = () => go("/billing/portal", {}, pb, "Opening billing portal");

    // After returning from checkout, the plan updates when Stripe confirms. Refresh a few times.
    clearTimeout(pollTimer);
    if (checkout === "success" && !subscribed) {
      let tries = 0;
      pollTimer = setTimeout(async function tick() {
        if (parseRoute().name !== "billing" || ++tries > 6) return;
        try { state.me = await api("GET", "/me"); const b = await api("GET", "/billing"); if (b.plan !== "none") return renderBilling(el, params); } catch (e) { /* keep trying */ }
        pollTimer = setTimeout(tick, 2500);
      }, 2500);
    }
  }

  /* ---------- settings ---------- */
  async function renderSettings(el) {
    const u = state.me.user;
    el.innerHTML = `<h1>Account settings</h1><p class="lead">${esc(u.email)}</p>
      <form class="card" id="profileForm"><h2>Profile</h2><p class="muted">Used on invoices and when we contact you.</p><div id="pMsg"></div>
        <div class="row-2"><div class="form-group"><label for="sName">Your name</label><input id="sName" value="${esc(u.name)}" autocomplete="name" required></div>
        <div class="form-group"><label for="sCompany">Company name</label><input id="sCompany" value="${esc(u.company)}" autocomplete="organization"></div></div>
        <div class="form-group"><label for="sEmail">Email</label><input id="sEmail" value="${esc(u.email)}" disabled><p class="hint">To change your email, <a href="${supportLink("Please change the email on my Bubble5 account from " + u.email + " to: ")}">contact us</a>.</p></div>
        <button class="btn btn-primary" type="submit">Save changes</button></form>
      ${u.password_set === false ? `<div class="card"><h2>Password</h2><p class="muted">You signed in with Google, so there is no password to manage. If you would like one as well, use <a href="#/forgot">Forgot password</a>.</p></div>` : `<form class="card" id="pwForm"><h2>Password</h2><p class="muted">Changing it signs you out on your other devices.</p><div id="wMsg"></div>
        <div class="form-group"><label for="curPw">Current password</label><input id="curPw" type="password" autocomplete="current-password" required></div>
        <div class="form-group"><label for="newPw">New password</label><input id="newPw" type="password" autocomplete="new-password" required><p class="hint">At least 8 characters.</p></div>
        <button class="btn btn-outline" type="submit">Change password</button></form>`}
      <div class="card"><h2>Billing and invoices</h2><p class="muted">Update your card, download invoices or cancel your subscription in Stripe's secure customer portal.</p><a class="btn btn-primary" href="${STRIPE_PORTAL_LOGIN}?prefilled_email=${encodeURIComponent(u.email)}" target="_blank" rel="noopener noreferrer">Manage billing in Stripe</a><p class="hint">Stripe emails a one-time sign-in link to ${esc(u.email)}. It opens in a new tab.</p></div>
      <div class="card"><h2>Session</h2><p class="muted">Log out of Bubble5 on this device.</p><button class="btn btn-outline" id="logoutBtn2">Log out</button></div>
      <form class="card danger-zone" id="delForm"><h2>Delete account</h2><p class="muted">Permanently removes your account and knowledge base. This can't be undone. Cancel any subscription first.</p><div id="dMsg"></div>
        ${u.password_set === false ? `<div class="form-group"><label for="delPw">Type DELETE to confirm</label><input id="delPw" autocomplete="off" required></div>` : `<div class="form-group"><label for="delPw">Enter your password to confirm</label><input id="delPw" type="password" autocomplete="current-password" required></div>`}
        <button class="btn btn-danger" type="submit">Delete my account</button></form>`;
    function wire(id, msgId, fn, okText) {
      document.getElementById(id).addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById(msgId), btn = e.target.querySelector("button[type=submit]");
        msg.innerHTML = ""; btn.disabled = true;
        try { await fn(); if (okText) msg.innerHTML = notice("ok", okText); } catch (err) { msg.innerHTML = notice("err", esc(err.message)); }
        btn.disabled = false;
      });
    }
    wire("profileForm", "pMsg", async () => { const out = await api("PATCH", "/me", { name: document.getElementById("sName").value, company: document.getElementById("sCompany").value }); state.me.user = out.user; }, "Saved.");
    if (document.getElementById("pwForm")) wire("pwForm", "wMsg", async () => { await api("POST", "/me/password", { current_password: document.getElementById("curPw").value, new_password: document.getElementById("newPw").value }); document.getElementById("pwForm").reset(); }, "Password changed. Other devices have been signed out.");
    wire("delForm", "dMsg", async () => {
      if (!confirm("Delete your account and everything in it? This can't be undone.")) return;
      await api("DELETE", "/me", u.password_set === false ? { confirm: document.getElementById("delPw").value } : { password: document.getElementById("delPw").value });
      setToken(""); state.me = null; location.hash = "#/signup";
    });
    document.getElementById("logoutBtn2").onclick = () => logoutBtn.click();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
