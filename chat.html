<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<meta name="robots" content="noindex">
<meta name="description" content="Ask us anything. Instant answers, any time.">
<link rel="icon" href="assets/brand/avatar.png">
<style>
:root{--c:#0E7C7B;--ink:#0F2A2E;--soft:#4b6366;--line:#dbe6e4;--sun:#FFC53D}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--c);background-image:radial-gradient(circle at 15% 10%,rgba(255,255,255,.22),transparent 40%),radial-gradient(circle at 90% 90%,rgba(0,0,0,.22),transparent 45%);display:flex;justify-content:center;align-items:stretch;padding:20px}
.shell{width:100%;max-width:520px;display:flex;flex-direction:column;background:#fff;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;height:calc(100vh - 40px);height:calc(100dvh - 40px);max-height:860px;align-self:center}
.top{background:var(--c);color:#fff;padding:22px 22px 26px;position:relative;background-image:radial-gradient(circle at 100% 0,rgba(255,255,255,.2),transparent 55%)}
.who{display:flex;align-items:center;gap:14px}
.av{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-weight:800;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none}
.who b{font-size:20px;display:block;line-height:1.2}
.who small{opacity:.92;font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4ade80;margin-right:6px;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hello{margin-top:16px;font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#f5f8f7;margin-top:-14px;border-radius:22px 22px 0 0;position:relative}
.m{max-width:85%;padding:11px 15px;border-radius:18px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.u{background:var(--c);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#9aaeb0;animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.chips button{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:9px 15px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;transition:transform .12s,background .12s,color .12s}
.chips button:hover{background:var(--c);color:#fff;transform:translateY(-1px)}
.card{background:#fff;border:2px solid var(--c);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;align-self:stretch}
.card b{font-size:16px}
.card input,.card textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px}
.card .go{border:0;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:16px;font-family:inherit;padding:12px;cursor:pointer}
.card .ok{color:#177a3c}.card .err{color:#b3261e;font-size:14px}
form.send{display:flex;gap:10px;padding:12px 14px;background:#fff;border-top:1px solid var(--line)}
form.send input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:13px 18px;font:inherit;font-size:16px}
form.send button{border:0;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:16px;font-family:inherit;padding:0 22px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pw{text-align:center;font-size:12.5px;color:#7a8e90;padding:8px;background:#fff}.pw a{color:inherit;font-weight:600}
.msg{margin:auto;text-align:center;color:var(--soft);padding:30px}
@media(max-width:560px){body{padding:0}.shell{border-radius:0;height:100vh;height:100dvh;max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell" id="shell" aria-label="Chat">
  <div class="msg" id="loading">Loading&hellip;</div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), key = q.get("b") || q.get("key") || "";
  var API = (location.hostname === "localhost" || location.protocol === "file:") ? "https://bubble5.online" : location.origin;
  var api = API + "/bot/" + encodeURIComponent(key);
  var shell = document.getElementById("shell");
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fail(t) { shell.innerHTML = ""; shell.appendChild(el("div", "msg", t)); }
  if (!/^bk_[0-9a-f]{24}$/.test(key)) return fail("This chat link is not valid. Please check the link you were given.");
  var vid; try { vid = localStorage.getItem("b5_vid"); if (!vid) { vid = "v" + Math.random().toString(36).slice(2, 12); localStorage.setItem("b5_vid", vid); } } catch (e) { vid = "v" + Math.random().toString(36).slice(2, 12); }
  var history = [];

  fetch(api + "/config").then(function (r) { return r.ok ? r.json() : null; }).then(function (cfg) {
    if (!cfg) return fail("We could not find this chat. Please check the link.");
    if (!cfg.enabled) return fail("This assistant is switched off right now. Please contact the business directly.");
    start(cfg);
  }).catch(function () { fail("Could not load the chat. Please check your connection and try again."); });

  function start(cfg) {
    var color = /^#[0-9a-f]{6}$/i.test(cfg.color) ? cfg.color : "#0E7C7B";
    document.documentElement.style.setProperty("--c", color);
    var title = cfg.business || cfg.name || "Chat";
    document.title = "Chat with " + title;
    shell.innerHTML = "";
    var top = el("div", "top"), who = el("div", "who");
    who.appendChild(el("div", "av", title.charAt(0).toUpperCase()));
    var wt = el("div"); wt.appendChild(el("b", null, title));
    var sm = el("small"); sm.appendChild(el("span", "dot")); sm.appendChild(document.createTextNode(cfg.name + " · online, replies instantly")); wt.appendChild(sm);
    who.appendChild(wt); top.appendChild(who); top.appendChild(el("div", "hello", "Hi there! How can we help today?"));
    var log = el("div", "log"); log.setAttribute("aria-live", "polite");
    var form = el("form", "send"), input = el("input"), send = el("button", null, "Send");
    input.type = "text"; input.maxLength = 500; input.placeholder = "Type your question…"; input.setAttribute("aria-label", "Your message"); input.autocomplete = "off"; send.type = "submit";
    form.appendChild(input); form.appendChild(send);
    var pw = el("div", "pw"); pw.appendChild(document.createTextNode("Powered by "));
    var a = el("a", null, "Bubble5"); a.href = "https://bubble5.online"; a.target = "_blank"; a.rel = "noopener"; pw.appendChild(a);
    [top, log, form, pw].forEach(function (x) { shell.appendChild(x); });

    function fmt(m, text) { String(text).split("**").forEach(function (p, i) { if (!p) return; if (i % 2) m.appendChild(el("strong", null, p)); else m.appendChild(document.createTextNode(p)); }); }
    function add(role, text) { var m = el("div", "m " + (role === "user" ? "u" : "a")); fmt(m, text); log.appendChild(m); log.scrollTop = log.scrollHeight; return m; }
    var chipBox = null;
    function chips(list) {
      if (chipBox) { chipBox.remove(); chipBox = null; }
      if (!list || !list.length) return;
      chipBox = el("div", "chips");
      list.slice(0, 4).forEach(function (t) { var b = el("button", null, t); b.type = "button"; b.onclick = function () { ask(t); }; chipBox.appendChild(b); });
      log.appendChild(chipBox); log.scrollTop = log.scrollHeight;
    }
    var lastQ = "";
    function card(kind) {
      if (log.querySelector(".card")) return;
      var booking = kind === "book", box = el("div", "card");
      box.appendChild(el("b", null, booking ? "Request a booking" : "Leave your details and we will get back to you"));
      var n = el("input"); n.placeholder = "Your name"; n.setAttribute("aria-label", "Your name");
      var e = el("input"); e.type = "email"; e.placeholder = "Email"; e.setAttribute("aria-label", "Your email");
      var ph = el("input"); ph.type = "tel"; ph.placeholder = "Phone (optional)"; ph.setAttribute("aria-label", "Your phone");
      var t = el("textarea"); t.rows = 2; t.placeholder = booking ? "Preferred day and time, and anything we should know" : "Your question (optional)"; t.setAttribute("aria-label", "Message");
      var b = el("button", "go", booking ? "Send request" : "Send to the team"); b.type = "button";
      var err = el("div", "err");
      b.onclick = function () {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value)) { err.textContent = "Please enter a valid email."; return; }
        b.disabled = true;
        var body = booking ? "BOOKING REQUEST\nWhen: " + (t.value || "not given") + (ph.value ? "\nPhone: " + ph.value : "") + "\nAsked: " + lastQ : (t.value || lastQ) + (ph.value ? "\nPhone: " + ph.value : "");
        fetch(api + "/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: n.value, email: e.value, message: body }) })
          .then(function (r) { if (!r.ok) throw 0; box.innerHTML = ""; box.appendChild(el("div", "ok", booking ? "Request sent! We will confirm by email shortly." : "Thank you! We will be in touch soon.")); })
          .catch(function () { b.disabled = false; err.textContent = "Could not send. Please try again."; });
      };
      [n, e, ph, t, b, err].forEach(function (x) { box.appendChild(x); });
      log.appendChild(box); log.scrollTop = log.scrollHeight;
    }
    var busy = false;
    function ask(text) {
      if (!text || busy) return;
      busy = true; send.disabled = true; lastQ = text; chips([]);
      add("user", text); history.push({ role: "user", content: text });
      var w = el("div", "m a dots"); w.innerHTML = "<span></span><span></span><span></span>"; log.appendChild(w); log.scrollTop = log.scrollHeight;
      var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 40000);
      fetch(api + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal, body: JSON.stringify({ visitor: vid, messages: history.slice(-8) }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          w.remove();
          if (res.ok) {
            add("assistant", res.j.answer); history.push({ role: "assistant", content: res.j.answer });
            if (res.j.handoff) card("lead"); else if (res.j.action === "book") card("book"); else chips(res.j.chips);
          } else { add("assistant", res.j.message || res.j.error || "Sorry, something went wrong."); history.pop(); }
        })
        .catch(function () { w.remove(); add("assistant", "Sorry, I could not reach the assistant. Please try again."); history.pop(); })
        .then(function () { clearTimeout(to); busy = false; send.disabled = false; input.focus(); });
    }
    form.onsubmit = function (ev) { ev.preventDefault(); var t = input.value.trim(); if (!t) return; input.value = ""; ask(t); };
    add("assistant", cfg.greeting); chips(cfg.starters);
  }
})();
</script>
</body>
</html>
